name: Pair Rebalancing Study

# Manual only. This is a research run, not part of the daily pipeline.
on:
  workflow_dispatch:

# Without this the bot cannot push and the run still reports success, because
# the retry loop exits normally after its last failed attempt.
permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: alphahunter-ai
        run: pip install -r requirements.txt

      - name: Run the pair study
        working-directory: alphahunter-ai
        run: python -m backend.run_pair_study

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alphahunter-ai/results/pair_study.json
          git diff --staged --quiet || git commit -m "Pair rebalancing study $(date -u +%Y-%m-%d)"
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              pushed=1; break
            fi
            sleep $((i * 3))
          done
          # Fail loudly. A green run that silently pushed nothing is worse than
          # a red one — it took four failed pushes before I noticed.
          if [ "$pushed" -ne 1 ]; then
            echo "::error::could not push results after 4 attempts"
            exit 1
          fi
